<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Sugiere un tema · Feedback 360 DIENN 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=Nunito:wght@600;700&display=swap">
<style>
:root{
  --bg:#FBF5EE; --dots:#EADBC8; --surface:#FFFFFF; --ink:#2B1D14; --muted:#6B5444; --line:#EEDFCF;
  --accent:#B4472A; --accent-ink:#FFFFFF; --note-ink:#2A2418;
  --hero:linear-gradient(120deg,#B4472A 0%,#E07A3F 55%,#E9A23B 120%);
  --shadow:0 1px 2px rgba(80,40,20,.06),0 10px 30px rgba(80,40,20,.08);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1410; --dots:#2A2540; --surface:#261C16; --ink:#F5ECE4; --muted:#C2AE9E; --line:#3D2E24;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.35);
}}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);background-image:radial-gradient(var(--dots) 1.2px,transparent 1.4px);background-size:24px 24px;color:var(--ink);font:15px/1.55 "Figtree","Segoe UI",system-ui,sans-serif}
.wrap{max-width:720px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-right)) 64px max(16px,env(safe-area-inset-left))}
.hero{background:var(--hero);color:#fff;border-radius:24px;padding:26px 24px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px}
.hero h1{font-family:"Bricolage Grotesque","Segoe UI",sans-serif;font-size:clamp(1.7rem,6vw,2.4rem);line-height:1.1;margin:0}
.eyebrow{font-size:.74rem;letter-spacing:.1em;text-transform:uppercase;font-weight:700;color:rgba(255,255,255,.85)}
.hero p{margin:0;font-size:1.02rem}
form{margin-top:18px;background:#FFE7F0;color:var(--note-ink);border-radius:3px 3px 14px 3px;padding:18px;box-shadow:0 1px 1px rgba(0,0,0,.08),0 8px 16px rgba(0,0,0,.12);display:flex;flex-direction:column;gap:12px}
label{font-weight:700}
textarea{width:100%;min-height:110px;border:0;background:transparent;font:600 16px/1.4 "Nunito","Figtree",sans-serif;color:var(--note-ink);resize:vertical}
textarea:focus-visible{outline:2px solid rgba(42,36,24,.35);outline-offset:4px;border-radius:6px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
button{border:0;background:var(--note-ink);color:#FFE7F0;border-radius:999px;padding:.6rem 1.2rem;font:700 .95rem "Figtree",sans-serif;cursor:pointer}
button:disabled{opacity:.5;cursor:default}
.hint{font-size:.85rem;opacity:.75}
h2{font-family:"Bricolage Grotesque","Segoe UI",sans-serif;font-size:1.2rem;margin:28px 0 10px}
.ideas{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.idea{border-radius:3px 3px 12px 3px;padding:12px 14px;color:var(--note-ink);font:600 1rem/1.35 "Nunito","Figtree",sans-serif;box-shadow:0 1px 1px rgba(0,0,0,.08),0 6px 12px rgba(0,0,0,.1);overflow-wrap:anywhere}
.muted{color:var(--muted)}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:999px;font-weight:600;box-shadow:var(--shadow)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <span class="eyebrow">Feedback 360 DIENN 2026 · Cápsulas</span>
    <h1>¿Sobre qué te gustaría aprender?</h1>
    <p>Cuéntanos qué temas quieres que toquemos en las cápsulas que acompañan este proceso de feedback. Es anónimo.</p>
  </div>
  <form id="f">
    <label for="t">Tu tema o pregunta</label>
    <textarea id="t" maxlength="300" placeholder="Ej.: ¿Cómo recibo feedback sin ponerme a la defensiva?" required></textarea>
    <div class="row"><span class="hint" id="h">Puedes enviar todos los temas que quieras.</span><button id="b" type="submit">Enviar tema</button></div>
  </form>
  <h2>Temas sugeridos por el equipo</h2>
  <div class="ideas" id="list"><p class="muted">Cargando…</p></div>
</div>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script>
const firebaseConfig = {
  apiKey: "AIzaSyDAiQwdseqZnxh0QuHkrpBrKyli0FIFMi4",
  authDomain: "feedback-dienn-2026.firebaseapp.com",
  projectId: "feedback-dienn-2026",
  storageBucket: "feedback-dienn-2026.firebasestorage.app",
  messagingSenderId: "181202884761",
  appId: "1:181202884761:web:1b45ed5eafb8c7d3134008"
};
const COLORS = ["#FFD3B0","#FFD6E0","#E6DAFF","#D3EBFF","#CDF3E1","#FFF2B3"];
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = s => document.querySelector(s);
function toast(msg){ const t=document.createElement("div"); t.className="toast"; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(),2600); }
let db;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  db.collection("temas").orderBy("at","desc").limit(200).onSnapshot(snap=>{
    const items = snap.docs.map(d=>d.data()).filter(d=>typeof d.text==="string");
    $("#list").innerHTML = items.length
      ? items.map((d,i)=>`<div class="idea" style="background:${COLORS[i%COLORS.length]}">${esc(d.text)}</div>`).join("")
      : `<p class="muted">Todavía no hay temas. ¡Sé la primera persona en proponer uno!</p>`;
  }, ()=>{ $("#list").innerHTML = `<p class="muted">No pudimos cargar los temas. Recarga la página.</p>`; });
}catch(e){ $("#list").innerHTML = `<p class="muted">No pudimos conectar. Revisa tu internet y recarga.</p>`; }
$("#f").addEventListener("submit", async e=>{
  e.preventDefault();
  const ta=$("#t"), text=ta.value.trim();
  if(text.length<3){ toast("Escribe un poco más"); return; }
  $("#b").disabled=true;
  try{ await db.collection("temas").add({text, at: Date.now()}); ta.value=""; toast("¡Gracias! Tema enviado"); }
  catch(x){ toast("No se pudo enviar. Intenta de nuevo."); }
  $("#b").disabled=false;
});
</script>
</body>
</html>
